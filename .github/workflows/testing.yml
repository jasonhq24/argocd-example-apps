name: pr-preview-build
run-name: Build image if PR has label preview
on:
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'ENG-**'
    types:
      - opened
      - labeled
      - synchronize
      - reopened
      - ready_for_review
jobs:
  next-job:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.closed == false && github.event.pull_request.merged == false && (github.event.label.name == 'preview' || contains( github.event.pull_request.labels.*.name, 'preview')) && github.event.pull_request.draft == false }}
    steps:
    - name: testing
      run: |
        echo "RUNNING 'preview' in labels: ${{ contains( github.event.pull_request.labels.*.name, 'preview') }}" 
  run-if-skipped:
    if: ${{ jobs.next-job.result == 'skipped' }}
    runs-on: ubuntu-latest
    
